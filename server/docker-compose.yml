services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - ENV=${ENV:-development}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_CORS_ORIGINS=${ALLOWED_CORS_ORIGINS:-*}
    restart: always

