services:
  - type: web
    name: oryn-api
    env: node
    region: oregon
    plan: free
    rootDir: server/api
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT_API
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_CORS_ORIGINS
        sync: false
      - key: AI_SERVICE_URL
        sync: false
  - type: web
    name: oryn-backend
    env: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: pip install uv && uv sync --no-dev && uv run prisma generate --schema=prisma/schema.prisma && uv run prisma db push --schema=prisma/schema.prisma
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
