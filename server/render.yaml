services:
  - type: web
    name: oryn-backend
    env: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: pip install uv && uv sync --no-dev && uv run prisma generate --schema=prisma/schema.prisma && uv run prisma db push --schema=prisma/schema.prisma
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
