services:
  - type: web
    name: oryn-api
    runtime: docker
    region: oregon
    plan: free
    rootDir: server
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENV
        value: production
      - key: AI_INTERNAL_PORT
        value: 8000
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:8000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_CORS_ORIGINS
        sync: false
