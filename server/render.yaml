services:
  - type: web
    name: oryn
    runtime: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: uv sync --locked && uv run prisma generate --schema=prisma/schema.prisma
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_SERVICE_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
  - type: web
    name: oryn-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server/api
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: oryn
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: oryn
          envVarKey: AI_SERVICE_TOKEN
